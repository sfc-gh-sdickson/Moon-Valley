  <text x="480" y="508" text-anchor="middle" fill="#555" font-size="9">Crew Notes | Care Guides | Warranty</text>

  <rect x="620" y="470" width="230" height="50" rx="6" fill="#fff3ed" stroke="#e8530e" stroke-width="1" filter="url(#sh)"/>
