  <rect x="110" y="600" width="740" height="28" rx="6" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1" filter="url(#sh)"/>
  <text x="480" y="619" text-anchor="middle" fill="#0e7fad" font-size="11">Data-to-Chart Visualization | 30+ Test Questions | 100% Daily-to-Line Fact Reconciliation</text>
