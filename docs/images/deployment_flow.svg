  <text x="285" y="573" text-anchor="middle" fill="#555" font-size="9">EXEC vs AZ Store Mgr RAP | PII Masking | USDA &amp; GS1</text>

  <rect x="485" y="535" width="365" height="50" rx="6" fill="#fff3ed" stroke="#e8530e" stroke-width="1" filter="url(#sh)"/>
  <text x="668" y="557" text-anchor="middle" fill="#b33f08" font-size="11" font-weight="bold">Managed MCP + Power BI</text>
