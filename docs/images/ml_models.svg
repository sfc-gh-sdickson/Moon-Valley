  <text x="152" y="352" text-anchor="middle" fill="#666" font-size="10">Target: WEEKLY_NET_SALES</text>
  <line x1="40" y1="362" x2="265" y2="362" stroke="#b3e5fc" stroke-width="1"/>
  <text x="45" y="382" fill="#333" font-size="10">Task</text>
  <text x="260" y="382" text-anchor="end" fill="#0e7fad" font-size="10" font-weight="bold">Regression (GBR)</text>
  <text x="45" y="402" fill="#333" font-size="10">Metrics Logged</text>
  <text x="260" y="402" text-anchor="end" fill="#0e7fad" font-size="10" font-weight="bold">MAE, R-squared</text>
  <text x="45" y="422" fill="#333" font-size="10">Agent Tool</text>
  <text x="260" y="422" text-anchor="end" fill="#0e7fad" font-size="10" font-weight="bold">ForecastWeeklySales</text>
  <line x1="40" y1="434" x2="265" y2="434" stroke="#b3e5fc" stroke-width="0.5"/>
  <text x="45" y="454" fill="#0e7fad" font-size="9">Features: State, Category, Season,</text>
  <text x="45" y="470" fill="#0e7fad" font-size="9">Peak Flag, Sq Ft, Store Age Months,</text>
  <text x="45" y="486" fill="#0e7fad" font-size="9">Trailing 4-Week Avg Sales</text>

  <rect x="295" y="310" width="245" height="195" rx="8" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="417" y="334" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">14-Day Stockout Risk</text>
  <text x="417" y="352" text-anchor="middle" fill="#666" font-size="10">Target: STOCKOUT_NEXT_14D_FLAG</text>
  <line x1="305" y1="362" x2="530" y2="362" stroke="#ffd4bf" stroke-width="1"/>
  <text x="310" y="382" fill="#333" font-size="10">Task</text>
  <text x="525" y="382" text-anchor="end" fill="#b33f08" font-size="10" font-weight="bold">Classification (GBC)</text>
  <text x="310" y="402" fill="#333" font-size="10">Metrics Logged</text>
  <text x="525" y="402" text-anchor="end" fill="#b33f08" font-size="10" font-weight="bold">Accuracy, F1 Score</text>
  <text x="310" y="422" fill="#333" font-size="10">Agent Tool</text>
  <text x="525" y="422" text-anchor="end" fill="#b33f08" font-size="10" font-weight="bold">StockoutRisk</text>
  <line x1="305" y1="434" x2="530" y2="434" stroke="#ffd4bf" stroke-width="0.5"/>
  <text x="310" y="454" fill="#b33f08" font-size="9">Features: On-Hand Units, On-Order,</text>
  <text x="310" y="470" fill="#b33f08" font-size="9">Daily Sell Rate, Days of Supply,</text>
  <text x="310" y="486" fill="#b33f08" font-size="9">Farm Lead Time, Peak &amp; Palm Flags</text>

  <rect x="560" y="310" width="245" height="195" rx="8" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="682" y="334" text-anchor="middle" fill="#5a3ec8" font-size="13" font-weight="bold">Planting Attach Propensity</text>
  <text x="682" y="352" text-anchor="middle" fill="#666" font-size="10">Target: INCLUDES_PLANTING_NUM</text>
  <line x1="570" y1="362" x2="795" y2="362" stroke="#d4c8ff" stroke-width="1"/>
  <text x="575" y="382" fill="#333" font-size="10">Task</text>
  <text x="790" y="382" text-anchor="end" fill="#5a3ec8" font-size="10" font-weight="bold">Classification (GBC)</text>
  <text x="575" y="402" fill="#333" font-size="10">Metrics Logged</text>
  <text x="790" y="402" text-anchor="end" fill="#5a3ec8" font-size="10" font-weight="bold">Accuracy, F1 Score</text>
  <text x="575" y="422" fill="#333" font-size="10">Agent Tool</text>
  <text x="790" y="422" text-anchor="end" fill="#5a3ec8" font-size="10" font-weight="bold">PlantingAttachPropensity</text>
  <line x1="570" y1="434" x2="795" y2="434" stroke="#d4c8ff" stroke-width="0.5"/>
  <text x="575" y="454" fill="#5a3ec8" font-size="9">Features: Customer Segment Code,</text>
  <text x="575" y="470" fill="#5a3ec8" font-size="9">Tree Units, Box-Tree Units, Total</text>
  <text x="575" y="486" fill="#5a3ec8" font-size="9">Units, Gross Ticket ($), Peak Flag</text>

  <rect x="825" y="310" width="245" height="195" rx="8" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="947" y="334" text-anchor="middle" fill="#007a31" font-size="13" font-weight="bold">Planting Delay Risk</text>
  <text x="947" y="352" text-anchor="middle" fill="#666" font-size="10">Target: DELAYED_FLAG</text>
  <line x1="835" y1="362" x2="1060" y2="362" stroke="#b9f6ca" stroke-width="1"/>
  <text x="840" y="382" fill="#333" font-size="10">Task</text>
  <text x="1055" y="382" text-anchor="end" fill="#007a31" font-size="10" font-weight="bold">Classification (GBC)</text>
  <text x="840" y="402" fill="#333" font-size="10">Metrics Logged</text>
  <text x="1055" y="402" text-anchor="end" fill="#007a31" font-size="10" font-weight="bold">Accuracy, F1 Score</text>
  <text x="840" y="422" fill="#333" font-size="10">Agent Tool</text>
  <text x="1055" y="422" text-anchor="end" fill="#007a31" font-size="10" font-weight="bold">PlantingDelayRisk</text>
  <line x1="835" y1="434" x2="1060" y2="434" stroke="#b9f6ca" stroke-width="0.5"/>
  <text x="840" y="454" fill="#007a31" font-size="9">Features: Days to Schedule, Tree</text>
  <text x="840" y="470" fill="#007a31" font-size="9">Count, Max Box Container Code,</text>
  <text x="840" y="486" fill="#007a31" font-size="9">Crew Size, Peak &amp; Crane Cert Flags</text>
