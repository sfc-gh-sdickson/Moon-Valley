  <rect x="835" y="75" width="235" height="175" rx="8" fill="#fff3ed" stroke="#e8530e" stroke-width="2" filter="url(#sh)"/>
  <text x="952" y="98" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">Snowflake Model Registry</text>
  <text x="952" y="115" text-anchor="middle" fill="#888" font-size="10">MVN_INTELLIGENCE.ANALYTICS</text>
  <line x1="845" y1="124" x2="1060" y2="124" stroke="#ffd4bf" stroke-width="1"/>
  <text x="952" y="144" text-anchor="middle" fill="#0e7fad" font-size="9" font-weight="bold">WEEKLY_SALES_FORECAST_MODEL/V1</text>
  <text x="952" y="166" text-anchor="middle" fill="#b33f08" font-size="9" font-weight="bold">STOCKOUT_RISK_MODEL/V1</text>
  <text x="952" y="188" text-anchor="middle" fill="#5a3ec8" font-size="9" font-weight="bold">PLANTING_ATTACH_MODEL/V1</text>
  <text x="952" y="210" text-anchor="middle" fill="#007a31" font-size="9" font-weight="bold">PLANTING_DELAY_RISK_MODEL/V1</text>
  <text x="952" y="234" text-anchor="middle" fill="#666" font-size="9">Called via MODEL()!PREDICT() UDFs</text>

  <!-- Bottom Section: 4 Model Cards -->
  <text x="550" y="290" text-anchor="middle" fill="#1a1a2e" font-size="16" font-weight="bold">Model Specifications &amp; Agent UDF Integration</text>

