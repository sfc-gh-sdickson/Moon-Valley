<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1100" height="540" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" fill="#1a1a2e" font-size="22" font-weight="bold">Moon Valley Nursery ML Model Pipeline</text>
  <text x="550" y="54" text-anchor="middle" fill="#666" font-size="11">Snowflake Model Registry (MVN_INTELLIGENCE.ANALYTICS) | 4 Registered GradientBoosting Models</text>

  <!-- Step 1: Data Sources -->
  <rect x="30" y="75" width="190" height="175" rx="8" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="125" y="100" text-anchor="middle" fill="#0e7fad" font-size="12" font-weight="bold">Data Sources</text>
  <text x="125" y="124" text-anchor="middle" fill="#555" font-size="10">FACT_SALES_LINE</text>
  <text x="125" y="144" text-anchor="middle" fill="#555" font-size="10">FACT_SALES_TRANSACTION</text>
  <text x="125" y="164" text-anchor="middle" fill="#555" font-size="10">FACT_INVENTORY_DAILY</text>
  <text x="125" y="184" text-anchor="middle" fill="#555" font-size="10">FACT_PLANTED_JOBS</text>
  <text x="125" y="204" text-anchor="middle" fill="#555" font-size="10">DIM_LOCATION &amp; PRODUCT</text>
  <text x="125" y="224" text-anchor="middle" fill="#555" font-size="10">DIM_DATE &amp; DIM_CREW</text>

  <line x1="220" y1="162" x2="258" y2="162" stroke="#29b5e8" stroke-width="1.5"/>
  <polygon points="256,158 266,162 256,166" fill="#29b5e8"/>

  <!-- Step 2: Feature Views -->
  <rect x="270" y="75" width="225" height="175" rx="8" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="382" y="100" text-anchor="middle" fill="#5a3ec8" font-size="12" font-weight="bold">Feature Engineering Views</text>
  <text x="382" y="125" text-anchor="middle" fill="#555" font-size="10">V_WEEKLY_SALES_STORE_CATEGORY</text>
  <text x="382" y="142" text-anchor="middle" fill="#888" font-size="9">4-wk lag sales, season, store age</text>
  <text x="382" y="162" text-anchor="middle" fill="#555" font-size="10">V_ML_STOCKOUT_FEATURES</text>
  <text x="382" y="179" text-anchor="middle" fill="#888" font-size="9">days of supply, sell rate, lead time</text>
  <text x="382" y="199" text-anchor="middle" fill="#555" font-size="10">V_ML_PLANTING_ATTACH_FEATURES</text>
  <text x="382" y="219" text-anchor="middle" fill="#555" font-size="10">V_ML_PLANTING_DELAY_FEATURES</text>
  <text x="382" y="236" text-anchor="middle" fill="#888" font-size="9">box tier, crew size, crane cert</text>

  <line x1="495" y1="162" x2="533" y2="162" stroke="#7b61ff" stroke-width="1.5"/>
  <polygon points="531,158 541,162 531,166" fill="#7b61ff"/>

  <!-- Step 3: 4 Trained Models -->
  <rect x="545" y="72" width="240" height="40" rx="6" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="665" y="90" text-anchor="middle" fill="#0e7fad" font-size="11" font-weight="bold">Weekly Sales Forecast</text>
  <text x="665" y="104" text-anchor="middle" fill="#666" font-size="9">GBR | 150 trees | 7 features</text>

  <rect x="545" y="118" width="240" height="40" rx="6" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="665" y="136" text-anchor="middle" fill="#b33f08" font-size="11" font-weight="bold">14-Day Stockout Risk</text>
  <text x="665" y="150" text-anchor="middle" fill="#666" font-size="9">GBC | 120 trees | 7 features</text>

  <rect x="545" y="164" width="240" height="40" rx="6" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="665" y="182" text-anchor="middle" fill="#5a3ec8" font-size="11" font-weight="bold">Planting Attach Propensity</text>
  <text x="665" y="196" text-anchor="middle" fill="#666" font-size="9">GBC | 120 trees | 6 features</text>

  <rect x="545" y="210" width="240" height="40" rx="6" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="665" y="228" text-anchor="middle" fill="#007a31" font-size="11" font-weight="bold">Planting Delay Risk</text>
  <text x="665" y="242" text-anchor="middle" fill="#666" font-size="9">GBC | 120 trees | 6 features</text>

  <line x1="785" y1="162" x2="823" y2="162" stroke="#e8530e" stroke-width="1.5"/>
  <polygon points="821,158 831,162 821,166" fill="#e8530e"/>

